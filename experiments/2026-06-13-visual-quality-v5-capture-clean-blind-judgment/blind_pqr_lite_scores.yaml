notes: |-
  Scoring used only accepted pruned card IDs and active cleaned-manifest tile paths. Sites with thin or no accepted cards, especially Nurx and Belmar, were scored from active tiles and defaulted down to generic competence. Hallandale homepage tile-02-y02440 was not cited. The main uncertainty is that static full-page tiles can understate interaction polish, but visible overlap, sticky chrome competition, and weak contrast were treated as real visual evidence when present in active tiles.
