- notes: |-
    Color and imagery were easiest to judge when a tile showed a hero plus the next module, because palette continuity or breakage was visible in one screenshot. It was harder to separate intentional campaign variety from weak brand cohesion on long pages, especially for sites with attractive photography but repeated template modules. Static tiles also hide motion and carousel sequencing, so claims stay limited to visible crops, surfaces, and image treatments.
