notes: |
  Iconography and product-graphic evidence was easiest to judge where tiles showed repeated systems: benefit icons, product cards, treatment cards, maps, diagrams, and app-like panels. It was harder to judge illustration quality when pages relied mainly on photography, because static tiles show whether photos are coherent but not whether motion, hover states, or off-screen carousel states add a stronger icon system elsewhere.
