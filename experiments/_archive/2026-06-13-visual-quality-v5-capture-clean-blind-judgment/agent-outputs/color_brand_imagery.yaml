notes: |-
  Static tiles made palette control and image consistency easy to detect, especially where pages repeated product cards, hero photos, or accent colors. Image provenance and whether photos are custom could not be verified from screenshots alone, so claims are limited to visible specificity, crop quality, and how owned the visual system appears.
