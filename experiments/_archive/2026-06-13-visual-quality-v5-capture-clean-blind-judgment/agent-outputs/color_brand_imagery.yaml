cards:
  - family: color_brand_imagery
    polarity: strong
    site: functionhealth.com
    page_or_region: "homepage hero"
    tile_path: "experiments/2026-06-13-gpt55-visual-quality-examples/raw/browser-captures/function-homepage-iab-desktop-viewport-tiles/tile-00-y00000.png"
    claim: "The hero uses a restrained, owned-feeling health image system rather than generic clinical stock."
    visible_tells:
      - "Full-bleed close side-profile portrait in a desert landscape, with muted olive, sand, and brown tones."
      - "Rust top bar and CTA color echo the warm image palette instead of introducing a separate accent system."
    confidence: high

  - family: color_brand_imagery
    polarity: strong
    site: functionhealth.com
    page_or_region: "pricing lab-test categories"
    tile_path: "experiments/2026-06-13-gpt55-visual-quality-examples/tiles-clean/functionhealth-com/pricing/tile-02-y02440.png"
    claim: "The pricing page keeps brand control through a narrow cream-and-rust palette and data-adjacent illustration."
    visible_tells:
      - "The comparison matrix uses cream backgrounds with one rust-highlighted column instead of many competing plan colors."
      - "The lower cards pair a pale U.S. map and vertical bar graphic with the same rust accent used in buttons and labels."
    confidence: high

